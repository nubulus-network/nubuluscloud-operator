---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tunnels.tunnel.nubulusnetwork.es
spec:
  group: tunnel.nubulusnetwork.es
  names:
    kind: Tunnel
    listKind: TunnelList
    plural: tunnels
    shortNames:
    - tun
    singular: tunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.onlineStatus
      name: Online
      type: string
    - jsonPath: .status.cnameTarget
      name: CNAME target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tunnel is one WireGuard tunnel between this cluster and the platform, plus
          the agent that keeps it up.

          Traffic reaches the services in this cluster through the routes that point at
          it; a Tunnel on its own carries nothing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state.
            properties:
              agent:
                description: agent is how the tunnel client is deployed in this cluster.
                properties:
                  image:
                    description: |-
                      image of the tunnel agent. Defaults to the one this operator was built
                      against, which is what makes an upgrade of the operator also an upgrade
                      of every agent it manages.
                    type: string
                  imagePullPolicy:
                    description: imagePullPolicy for the agent container.
                    type: string
                  imagePullSecrets:
                    description: imagePullSecrets for a private registry.
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  logLevel:
                    default: info
                    description: logLevel of the agent.
                    enum:
                    - debug
                    - info
                    - warn
                    - error
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: nodeSelector for the agent pod.
                    type: object
                  resources:
                    description: |-
                      resources for the agent container. The agent is a small Go proxy; it
                      needs far less than most people's default.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  tolerations:
                    description: tolerations for the agent pod.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                type: object
              credentials:
                description: credentials is the application token this tunnel is created
                  with.
                properties:
                  clientIDKey:
                    default: client_id
                    description: clientIDKey is the key holding the client id.
                    type: string
                  clientSecretKey:
                    default: client_secret
                    description: clientSecretKey is the key holding the client secret.
                    type: string
                  name:
                    description: name of the Secret in this namespace holding the
                      application token.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              displayName:
                description: |-
                  displayName is a label carried by the tunnel in the platform. It is
                  cosmetic: nothing keys on it, and it does not have to be unique.

                  It is NOT what identifies this tunnel to the operator. That is the UID of
                  this object, sent as the tunnel's external id, which is what lets a
                  create whose answer was lost be recovered instead of repeated.
                maxLength: 64
                type: string
              endpoints:
                description: |-
                  endpoints overrides where the operator talks to the platform. Leave it
                  unset unless you are pointing at something other than production.
                properties:
                  api:
                    description: api is the base URL of the tunnel API.
                    type: string
                  projectID:
                    description: |-
                      projectID is the project the access token is scoped to. It is part of
                      two of the four scopes the credential must be requested with, so it
                      changes together with the identity provider and never on its own.
                    type: string
                  tokenURL:
                    description: tokenURL is the OAuth2 token endpoint.
                    type: string
                type: object
            required:
            - credentials
            type: object
          status:
            description: status is the observed state.
            properties:
              cnameTarget:
                description: |-
                  cnameTarget is what a customer hostname must be pointed at for traffic to
                  arrive. Publishing it is the one step this operator cannot do: the DNS it
                  would have to write is usually somewhere else entirely.
                type: string
              conditions:
                description: conditions of the tunnel.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialSecret:
                description: |-
                  credentialSecret is the Secret this tunnel's token was written to. It is
                  owned by this object and goes away with it.
                type: string
              externalID:
                description: |-
                  externalID is what the operator sent as this tunnel's identifier, which
                  is the UID of this object. It is surfaced so that a tunnel in the panel
                  can be traced back to the object that owns it.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the generation of the spec this status was
                  computed from.
                format: int64
                type: integer
              onlineStatus:
                description: |-
                  onlineStatus is whether the platform is currently seeing the client end,
                  derived from the last WireGuard handshake. It changes on its own with
                  nothing applied, so it is the one field here that is not a consequence of
                  the spec.
                type: string
              subdomain:
                description: subdomain is the name the platform serves this tunnel
                  on.
                type: string
              tunnelID:
                description: |-
                  tunnelID is the identifier the platform gave this tunnel. It is the
                  anchor for everything else, and it is recoverable from the external id
                  if it is ever lost.
                type: string
              wireGuardIP:
                description: wireGuardIP is the address assigned to the client end.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
