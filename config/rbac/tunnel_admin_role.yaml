# This rule is not used by the project nubuluscloud-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over tunnel.nubulusnetwork.es.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nubuluscloud-operator
    app.kubernetes.io/managed-by: kustomize
  name: tunnel-admin-role
rules:
- apiGroups:
  - tunnel.nubulusnetwork.es
  resources:
  - tunnels
  verbs:
  - '*'
- apiGroups:
  - tunnel.nubulusnetwork.es
  resources:
  - tunnels/status
  verbs:
  - get
